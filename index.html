<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Mascotas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .info {
      text-align: left;
      margin-top: 25px;
    }

    .info p {
      margin: 10px 0;
    }

    .label {
      font-weight: bold;
    }

    .call-button {
      display: block;
      margin-top: 30px;
      padding: 16px;
      border-radius: 12px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>🐕 MAX</h1>

      <div class="subtitle">
        Placa inteligente para mascotas
      </div>

      <div class="info">
        <p><span class="label">Raza:</span> Beagle</p>
        <p><span class="label">Sexo:</span> Macho</p>
        <p><span class="label">Color:</span> Tricolor</p>
        <p><span class="label">Fecha de nacimiento:</span> 04/04/2017</p>
      </div>

      <a class="call-button" href="#">
        📞 Llamar al dueño
      </a>

    </div>

  </div>

</body>
</html>
