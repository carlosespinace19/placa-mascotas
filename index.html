<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Mascotas</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }
    .info {
      text-align: left;
      margin-top: 25px;
    }
    .info p {
      margin: 10px 0;
    }
    .owner-info {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 20px;
    }
    .label {
      font-weight: bold;
    }
    .call-button {
      display: block;
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .call-button:first-of-type {
      margin-top: 30px;
    }
    .location-button {
      background: #25D366;
    }
    .owner-info a {
      color: #222;
    }
    .loading, .error {
      padding: 40px 20px;
      color: #666;
    }
    .error {
      color: #c0392b;
    }
    body.lost-mode {
      background: #c0392b;
    }
    .lost-banner {
      background: #c0392b;
      color: white;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pulse 1.4s infinite;
    }
    .lost-banner .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .lost-mode .card {
      border: 3px solid #c0392b;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .tutor-link {
      display: block;
      margin-top: 20px;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      font-family: inherit;
    }
    .bell-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f5f5f5;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bell-btn.active {
      background: #fdecea;
    }
    .card-wrap {
      position: relative;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .modal-box h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }
    .modal-box p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .modal-box input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .modal-row {
      display: flex;
      gap: 10px;
    }
    .modal-row button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .modal-btn-yes {
      background: #c0392b;
      color: white;
    }
    .modal-btn-no {
      background: #eee;
      color: #333;
    }
    .modal-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 12px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="loading">Cargando datos de la mascota...</div>
      </div>
    </div>
  </div>
  <div id="modalContainer"></div>

  <script>
    // ---- CONFIGURA ESTOS DOS VALORES CON LOS DE TU PROYECTO SUPABASE ----
    const SUPABASE_URL = "https://teihrqczskfvoumuqrim.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaWhycWN6c2tmdm91bXVxcmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMzM0MjcsImV4cCI6MjEwMTgwOTQyN30.DgNthzgATvcRYgoE4JOfTP-9pm4-wsXjf1sQQsJHlb4";
    // -----------------------------------------------------------------

    function getTokenFromUrl() {
      // Espera URLs tipo /p/7F4K9X2M
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      // dateStr viene como "YYYY-MM-DD" desde Supabase.
      // Se parsea manualmente para evitar desfases de zona horaria.
      const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
      if (!match) return dateStr;
      const [, yyyy, mm, dd] = match;
      return `${dd}-${mm}-${yyyy}`;
    }

    function speciesEmoji(species) {
      const s = (species || "").trim().toLowerCase();
      const map = {
        perro: "🐕",
        gato: "🐈",
        ave: "🐦",
        conejo: "🐇",
        tortuga: "🐢",
        hamster: "🐹",
        hámster: "🐹"
      };
      return map[s] || "🐾";
    }

    function mapsLink(address) {
      if (!address) return null;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
    }

    async function loadPet() {
      const card = document.getElementById("card");
      const token = getTokenFromUrl();

      if (!token) {
        card.innerHTML = '<div class="error">No se encontró el código de la placa en la URL.</div>';
        return;
      }

      try {
        const url = SUPABASE_URL +
          "/rest/v1/plates?public_token=eq." + encodeURIComponent(token) +
          "&status=eq.active&select=*,pets(*)";

        const res = await fetch(url, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) {
          throw new Error("Error al consultar la base de datos (" + res.status + ")");
        }

        const data = await res.json();

        if (!data || data.length === 0) {
          card.innerHTML = '<div class="error">Esta placa no está registrada o no está activa.</div>';
          return;
        }

        const plate = data[0];
        const pet = plate.pets && plate.pets[0];

        if (!pet) {
          card.innerHTML = '<div class="error">Esta placa aún no tiene una mascota asociada.</div>';
          return;
        }

        if (plate.is_lost) {
          document.body.classList.add("lost-mode");
        }

        const lostBanner = plate.is_lost ? `
          <div class="lost-banner">
            <div class="title">🚨 MASCOTA PERDIDA</div>
            <div>${plate.lost_message || "¡Ayúdame a volver a casa!"}</div>
          </div>
        ` : "";

        card.innerHTML = `
          ${lostBanner}
          <h1>${speciesEmoji(pet.species)} ${pet.name || "Sin nombre"}</h1>
          <div class="subtitle">Placa inteligente para mascotas</div>
          <div class="info">
            <p><span class="label">Raza:</span> ${pet.breed || "-"}</p>
            <p><span class="label">Sexo:</span> ${pet.sex || "-"}</p>
            <p><span class="label">Color:</span> ${pet.color || "-"}</p>
            <p><span class="label">Fecha de nacimiento:</span> ${formatDate(pet.birth_date)}</p>
          </div>
          ${(pet.owner_name || pet.home_address) ? `
          <div class="info owner-info">
            <p><span class="label">Tutor:</span> ${pet.owner_name || "-"}</p>
            <p><span class="label">Dirección:</span> ${
              pet.home_address
                ? `<a href="${mapsLink(pet.home_address)}" target="_blank" rel="noopener">${pet.home_address}</a>`
                : "-"
            }</p>
          </div>` : ''}
          ${pet.owner_phone ? `<a class="call-button" href="tel:${pet.owner_phone}">📞 Llamar al tutor</a>` : ''}
          ${pet.owner_phone ? `<button class="call-button location-button" id="shareLocationBtn" data-phone="${pet.owner_phone}" data-pet="${pet.name || ''}">📍 Compartir mi ubicación</button>` : ''}
        `;

        const cardWrap = document.querySelector(".card-wrap");
        const bellBtn = document.createElement("button");
        bellBtn.className = "bell-btn" + (plate.is_lost ? " active" : "");
        bellBtn.id = "bellBtn";
        bellBtn.title = plate.is_lost ? "La mascota está marcada como perdida" : "¿Se perdió tu mascota?";
        bellBtn.textContent = "🔔";
        cardWrap.appendChild(bellBtn);
        bellBtn.addEventListener("click", () => openLostModal(plate, pet));

        const shareBtn = document.getElementById("shareLocationBtn");
        if (shareBtn) {
          shareBtn.addEventListener("click", () => shareLocation(shareBtn.dataset.phone, shareBtn.dataset.pet));
        }
      } catch (err) {
        card.innerHTML = '<div class="error">Ocurrió un error al cargar los datos. Intenta de nuevo más tarde.</div>';
        console.error(err);
      }
    }

    function shareLocation(phone, petName) {
      const btn = document.getElementById("shareLocationBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "📍 Obteniendo ubicación...";
      }

      if (!navigator.geolocation) {
        alert("Tu navegador no permite compartir ubicación. Puedes llamar al tutor directamente.");
        if (btn) { btn.disabled = false; btn.textContent = "📍 Compartir mi ubicación"; }
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
          const text = encodeURIComponent(
            `Hola, encontré a ${petName || "tu mascota"} 🐾. Esta es mi ubicación: ${mapsUrl}`
          );
          const cleanPhone = (phone || "").replace(/[^\d]/g, "");
          window.open(`https://wa.me/${cleanPhone}?text=${text}`, "_blank");
          if (btn) { btn.disabled = false; btn.textContent = "📍 Compartir mi ubicación"; }
        },
        (err) => {
          alert("No se pudo obtener tu ubicación. Revisa los permisos de ubicación del navegador e intenta de nuevo.");
          if (btn) { btn.disabled = false; btn.textContent = "📍 Compartir mi ubicación"; }
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function closeModal() {
      document.getElementById("modalContainer").innerHTML = "";
    }

    function openLostModal(plate, pet) {
      const container = document.getElementById("modalContainer");
      const petName = pet.name || "tu mascota";

      if (!plate.is_lost) {
        // Paso 1: preguntar si se perdió
        container.innerHTML = `
          <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
              <h2>¿${petName} se ha perdido?</h2>
              <p>Si confirmas, la placa mostrará una alerta a quien la escanee.</p>
              <div class="modal-row">
                <button class="modal-btn-no" id="modalNo">No</button>
                <button class="modal-btn-yes" id="modalYes">Sí, se perdió</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("modalNo").addEventListener("click", closeModal);
        document.getElementById("modalOverlay").addEventListener("click", (e) => {
          if (e.target.id === "modalOverlay") closeModal();
        });
        document.getElementById("modalYes").addEventListener("click", () => openPinModal(plate, pet, true));
      } else {
        // Ya está perdida: preguntar si la encontraron
        container.innerHTML = `
          <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
              <h2>¿Ya encontraste a ${petName}?</h2>
              <p>Si confirmas, se quitará la alerta de la placa.</p>
              <div class="modal-row">
                <button class="modal-btn-no" id="modalNo">Todavía no</button>
                <button class="modal-btn-yes" id="modalYes">Sí, la encontré</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("modalNo").addEventListener("click", closeModal);
        document.getElementById("modalOverlay").addEventListener("click", (e) => {
          if (e.target.id === "modalOverlay") closeModal();
        });
        document.getElementById("modalYes").addEventListener("click", () => openPinModal(plate, pet, false));
      }
    }

    function openPinModal(plate, pet, goingLost) {
      const container = document.getElementById("modalContainer");
      container.innerHTML = `
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal-box">
            <h2>Código de seguridad</h2>
            <p>Ingresa el código de 4 dígitos del tutor para confirmar.</p>
            <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" placeholder="••••">
            <div class="modal-error" id="pinError"></div>
            <div class="modal-row">
              <button class="modal-btn-no" id="modalCancel">Cancelar</button>
              <button class="modal-btn-yes" id="modalConfirm">Confirmar</button>
            </div>
          </div>
        </div>
      `;
      const pinInput = document.getElementById("pinInput");
      pinInput.focus();
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target.id === "modalOverlay") closeModal();
      });
      document.getElementById("modalConfirm").addEventListener("click", () => {
        const entered = pinInput.value.trim();
        if (!plate.admin_pin || entered !== String(plate.admin_pin).trim()) {
          document.getElementById("pinError").textContent = "Código incorrecto.";
          return;
        }
        applyLostStatus(plate, goingLost);
      });
    }

    async function applyLostStatus(plate, goingLost) {
      try {
        const url = SUPABASE_URL + "/rest/v1/plates?public_token=eq." + encodeURIComponent(plate.public_token);
        const res = await fetch(url, {
          method: "PATCH",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            Prefer: "return=representation"
          },
          body: JSON.stringify({ is_lost: goingLost })
        });

        if (!res.ok) throw new Error("Error al actualizar");

        location.reload();
      } catch (err) {
        document.getElementById("pinError").textContent = "Ocurrió un error. Intenta de nuevo.";
      }
    }

    loadPet();
  </script>
</body>
</html>
