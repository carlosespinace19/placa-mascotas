<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Mascotas</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }
    .info {
      text-align: left;
      margin-top: 25px;
    }
    .info p {
      margin: 10px 0;
    }
    .label {
      font-weight: bold;
    }
    .call-button {
      display: block;
      margin-top: 30px;
      padding: 16px;
      border-radius: 12px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    .loading, .error {
      padding: 40px 20px;
      color: #666;
    }
    .error {
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="loading">Cargando datos de la mascota...</div>
    </div>
  </div>

  <script>
    // ---- CONFIGURA ESTOS DOS VALORES CON LOS DE TU PROYECTO SUPABASE ----
    const SUPABASE_URL = "https://teihrqczskfvoumuqrim.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaWhycWN6c2tmdm91bXVxcmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMzM0MjcsImV4cCI6MjEwMTgwOTQyN30.DgNthzgATvcRYgoE4JOfTP-9pm4-wsXjf1sQQsJHlb4";
    // -----------------------------------------------------------------

    function getTokenFromUrl() {
      // Espera URLs tipo /p/7F4K9X2M
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString("es-CL");
    }

    async function loadPet() {
      const card = document.getElementById("card");
      const token = getTokenFromUrl();

      if (!token) {
        card.innerHTML = '<div class="error">No se encontró el código de la placa en la URL.</div>';
        return;
      }

      try {
        const url = SUPABASE_URL +
          "/rest/v1/plates?public_token=eq." + encodeURIComponent(token) +
          "&status=eq.active&select=*,pets(*)";

        const res = await fetch(url, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) {
          throw new Error("Error al consultar la base de datos (" + res.status + ")");
        }

        const data = await res.json();

        if (!data || data.length === 0) {
          card.innerHTML = '<div class="error">Esta placa no está registrada o no está activa.</div>';
          return;
        }

        const plate = data[0];
        const pet = plate.pets && plate.pets[0];

        if (!pet) {
          card.innerHTML = '<div class="error">Esta placa aún no tiene una mascota asociada.</div>';
          return;
        }

        card.innerHTML = `
          <h1>🐕 ${pet.name || "Sin nombre"}</h1>
          <div class="subtitle">Placa inteligente para mascotas</div>
          <div class="info">
            <p><span class="label">Raza:</span> ${pet.breed || "-"}</p>
            <p><span class="label">Sexo:</span> ${pet.sex || "-"}</p>
            <p><span class="label">Color:</span> ${pet.color || "-"}</p>
            <p><span class="label">Fecha de nacimiento:</span> ${formatDate(pet.birth_date)}</p>
          </div>
          <a class="call-button" href="#">📞 Llamar al dueño</a>
        `;
      } catch (err) {
        card.innerHTML = '<div class="error">Ocurrió un error al cargar los datos. Intenta de nuevo más tarde.</div>';
        console.error(err);
      }
    }

    loadPet();
  </script>
</body>
</html>
