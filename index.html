<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Mascotas</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }
    .info {
      text-align: left;
      margin-top: 25px;
    }
    .info p {
      margin: 10px 0;
    }
    .owner-info {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 20px;
    }
    .label {
      font-weight: bold;
    }
    .call-button {
      display: block;
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .call-button:first-of-type {
      margin-top: 30px;
    }
    .location-button {
      background: #25D366;
    }
    .location-button.native-button {
      background: #3B82C4;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-right: 8px;
    }
    .btn-icon svg {
      width: 18px;
      height: 18px;
    }
    .share-section {
      margin-top: 24px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 14px;
    }
    .share-label {
      font-size: 13px;
      color: #666;
      font-weight: bold;
      margin: 0 0 10px;
      text-align: left;
    }
    .share-section .call-button:first-of-type {
      margin-top: 0;
    }
    .owner-info a {
      color: #222;
    }
    .loading, .error {
      padding: 40px 20px;
      color: #666;
    }
    .error {
      color: #c0392b;
    }
    body.lost-mode {
      background: #c0392b;
    }
    .lost-banner {
      background: #c0392b;
      color: white;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      text-align: center;
      animation: pulse 1.4s infinite;
    }
    .lost-banner .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .lost-mode .card {
      border: 3px solid #c0392b;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .call-button.urgent-pulse {
      animation: urgent-pulse 1.2s infinite;
    }
    @keyframes urgent-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      50% { box-shadow: 0 0 0 10px rgba(192,57,43,0); }
    }
    .info.compact p {
      font-size: 14px;
      margin: 6px 0;
    }
    .tutor-link {
      display: block;
      margin-top: 20px;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      font-family: inherit;
    }
    .bell-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff5f5;
      border: 2px solid #c0392b;
      color: #c0392b;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bell-pulse 1.8s infinite;
    }
    .bell-btn.active {
      background: #c0392b;
      animation: pulse 1.4s infinite;
    }
    @keyframes bell-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.35); }
      50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }
    .card-wrap {
      position: relative;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .modal-box h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }
    .modal-box p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .modal-box input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .modal-row {
      display: flex;
      gap: 10px;
    }
    .modal-row button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .modal-btn-yes {
      background: #c0392b;
      color: white;
    }
    .modal-btn-no {
      background: #eee;
      color: #333;
    }
    .modal-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 12px;
      min-height: 16px;
    }
    .help-steps {
      text-align: left;
      font-size: 14px;
      color: #444;
      padding-left: 20px;
      margin-bottom: 20px;
    }
    .help-steps li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="loading">Cargando datos de la mascota...</div>
      </div>
    </div>
  </div>
  <div id="modalContainer"></div>

  <script>
    // ---- CONFIGURA ESTOS DOS VALORES CON LOS DE TU PROYECTO SUPABASE ----
    const SUPABASE_URL = "https://teihrqczskfvoumuqrim.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlaWhycWN6c2tmdm91bXVxcmltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMzM0MjcsImV4cCI6MjEwMTgwOTQyN30.DgNthzgATvcRYgoE4JOfTP-9pm4-wsXjf1sQQsJHlb4";
    // -----------------------------------------------------------------

    function getTokenFromUrl() {
      // Espera URLs tipo /p/7F4K9X2M
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function formatDate(dateStr) {
      if (!dateStr) return "-";
      // dateStr viene como "YYYY-MM-DD" desde Supabase.
      // Se parsea manualmente para evitar desfases de zona horaria.
      const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr);
      if (!match) return dateStr;
      const [, yyyy, mm, dd] = match;
      return `${dd}-${mm}-${yyyy}`;
    }

    function speciesEmoji(species) {
      const s = (species || "").trim().toLowerCase();
      const map = {
        perro: "🐕",
        gato: "🐈",
        ave: "🐦",
        conejo: "🐇",
        tortuga: "🐢",
        hamster: "🐹",
        hámster: "🐹"
      };
      return map[s] || "🐾";
    }

    function mapsLink(address) {
      if (!address) return null;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
    }

    async function loadPet() {
      const card = document.getElementById("card");
      const token = getTokenFromUrl();

      if (!token) {
        card.innerHTML = '<div class="error">No se encontró el código de la placa en la URL.</div>';
        return;
      }

      try {
        const url = SUPABASE_URL +
          "/rest/v1/plates?public_token=eq." + encodeURIComponent(token) +
          "&status=eq.active&select=*,pets(*)";

        const res = await fetch(url, {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) {
          throw new Error("Error al consultar la base de datos (" + res.status + ")");
        }

        const data = await res.json();

        if (!data || data.length === 0) {
          card.innerHTML = '<div class="error">Esta placa no está registrada o no está activa.</div>';
          return;
        }

        const plate = data[0];
        const pet = plate.pets && plate.pets[0];

        if (!pet) {
          card.innerHTML = '<div class="error">Esta placa aún no tiene una mascota asociada.</div>';
          return;
        }

        if (plate.is_lost) {
          document.body.classList.add("lost-mode");
        }

        const lostBanner = plate.is_lost ? `
          <div class="lost-banner">
            <div class="title">🚨 MASCOTA PERDIDA</div>
            <div>${plate.lost_message || "¡Ayúdame a volver a casa!"}</div>
          </div>
        ` : "";

        const callButton = pet.owner_phone
          ? `<a class="call-button${plate.is_lost ? ' urgent-pulse' : ''}" href="tel:${pet.owner_phone}">📞 Llamar al tutor</a>`
          : '';

        const whatsappIcon = `<span class="btn-icon"><svg viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01C17.19 3.03 14.7 2 12.04 2zm0 18.13h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.15 8.15 0 01-1.25-4.36c0-4.51 3.67-8.18 8.19-8.18 2.19 0 4.24.85 5.79 2.4a8.13 8.13 0 012.4 5.79c0 4.52-3.68 8.19-8.19 8.19zm4.48-6.13c-.24-.12-1.44-.71-1.67-.79-.22-.08-.38-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.42-1.33-1.66-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.81-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.12.16 1.71 2.61 4.15 3.66.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg></span>`;
        const nativeShareIcon = `<span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></span>`;

        const whatsappButton = pet.owner_phone
          ? `<button class="call-button location-button" id="shareWhatsappBtn" data-phone="${pet.owner_phone}" data-pet="${pet.name || ''}">${whatsappIcon}Compartir por WhatsApp</button>`
          : '';

        const nativeButton = pet.owner_phone
          ? `<button class="call-button location-button native-button" id="shareNativeBtn" data-phone="${pet.owner_phone}" data-pet="${pet.name || ''}">${nativeShareIcon}Compartir directo</button>`
          : '';

        const locationButton = plate.is_lost ? `${whatsappButton}${nativeButton}` : '';

        const ownerBlock = (pet.owner_name || pet.home_address) ? `
          <div class="info owner-info">
            <p><span class="label">Tutor:</span> ${pet.owner_name || "-"}</p>
            <p><span class="label">Dirección:</span> ${
              pet.home_address
                ? `<a href="${mapsLink(pet.home_address)}" target="_blank" rel="noopener">${pet.home_address}</a>`
                : "-"
            }</p>
          </div>` : '';

        if (plate.is_lost) {
          // Modo perdido: contacto primero, datos esenciales compactos, sin fecha de nacimiento
          card.innerHTML = `
            ${lostBanner}
            <h1>${speciesEmoji(pet.species)} ${pet.name || "Sin nombre"}</h1>
            ${callButton}
            <div class="share-section">
              <div class="share-label">📍 Comparte tu ubicación para que puedan buscarla:</div>
              ${locationButton}
            </div>
            <div class="info compact">
              <p><span class="label">Raza:</span> ${pet.breed || "-"}</p>
              <p><span class="label">Sexo:</span> ${pet.sex || "-"}</p>
              <p><span class="label">Color:</span> ${pet.color || "-"}</p>
            </div>
            ${ownerBlock}
          `;
        } else {
          // Modo normal: orden habitual completo
          card.innerHTML = `
            <h1>${speciesEmoji(pet.species)} ${pet.name || "Sin nombre"}</h1>
            <div class="subtitle">Placa inteligente para mascotas</div>
            <div class="info">
              <p><span class="label">Raza:</span> ${pet.breed || "-"}</p>
              <p><span class="label">Sexo:</span> ${pet.sex || "-"}</p>
              <p><span class="label">Color:</span> ${pet.color || "-"}</p>
              <p><span class="label">Fecha de nacimiento:</span> ${formatDate(pet.birth_date)}</p>
            </div>
            ${ownerBlock}
            ${callButton}
          `;
        }

        const cardWrap = document.querySelector(".card-wrap");
        const bellBtn = document.createElement("button");
        bellBtn.className = "bell-btn" + (plate.is_lost ? " active" : "");
        bellBtn.id = "bellBtn";
        bellBtn.title = plate.is_lost ? "La mascota está marcada como perdida" : "¿Se perdió tu mascota?";
        bellBtn.textContent = plate.is_lost ? "🚨" : "🆘";
        cardWrap.appendChild(bellBtn);
        bellBtn.addEventListener("click", () => openLostModal(plate, pet));

        const whatsappBtn = document.getElementById("shareWhatsappBtn");
        if (whatsappBtn) {
          whatsappBtn.addEventListener("click", () => shareViaWhatsApp(whatsappBtn.dataset.phone, whatsappBtn.dataset.pet));
        }

        const nativeBtn = document.getElementById("shareNativeBtn");
        if (nativeBtn) {
          nativeBtn.addEventListener("click", () => shareViaNative(nativeBtn.dataset.phone, nativeBtn.dataset.pet));
        }
      } catch (err) {
        card.innerHTML = '<div class="error">Ocurrió un error al cargar los datos. Intenta de nuevo más tarde.</div>';
        console.error(err);
      }
    }

    function getCurrentMapsUrl() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject();
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
          () => reject(),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    function shareViaWhatsApp(phone, petName) {
      const name = petName || "tu mascota";
      const cleanPhone = (phone || "").replace(/[^\d]/g, "");

      const goToWhatsapp = (mapsUrl) => {
        const text = encodeURIComponent(
          mapsUrl
            ? `Hola, encontré a ${name} 🐾. Esta es mi ubicación: ${mapsUrl}`
            : `Hola, encontré a ${name} 🐾. Te voy a compartir mi ubicación por aquí para que puedas venir a buscarla. (Toca el clip 📎 y luego "Ubicación" para enviarla)`
        );
        window.location.href = `https://wa.me/${cleanPhone}?text=${text}`;
      };

      getCurrentMapsUrl().then(
        (mapsUrl) => goToWhatsapp(mapsUrl),
        () => goToWhatsapp(null)
      );
    }

    function shareViaNative(phone, petName) {
      const name = petName || "tu mascota";

      getCurrentMapsUrl().then(
        (mapsUrl) => {
          const shareData = {
            title: "Encontré a " + name,
            text: `Hola, encontré a ${name} 🐾. Esta es mi ubicación:`,
            url: mapsUrl
          };
          if (navigator.share) {
            navigator.share(shareData).catch(() => {});
          } else {
            // Sin Web Share API disponible: copiamos el link para que lo pegue donde quiera
            const fullText = shareData.text + " " + shareData.url;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(fullText);
              alert("Tu navegador no tiene menú de compartir. Copiamos el mensaje, puedes pegarlo en cualquier app.");
            } else {
              alert("Tu ubicación: " + mapsUrl);
            }
          }
        },
        () => showLocationHelp("native", phone, name)
      );
    }

    function showLocationHelp(source, cleanPhone, petName) {
      const container = document.getElementById("modalContainer");
      const ua = navigator.userAgent || "";
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      let steps;
      if (isIOS) {
        steps = [
          "Abre Ajustes en tu celular.",
          "Toca Privacidad y seguridad → Localización.",
          "Activa el interruptor de arriba si está apagado.",
          "Busca Safari (o el navegador que uses) en la lista y elige \"Al usar la app\".",
          "Vuelve a esta página y toca de nuevo el botón."
        ];
      } else if (isAndroid) {
        steps = [
          "Abre Ajustes en tu celular.",
          "Toca Ubicación (o Localización) y actívala.",
          "Abre los ajustes del navegador que estás usando (ej. Chrome) → Permisos del sitio → Ubicación, y permite el acceso.",
          "Vuelve a esta página y toca de nuevo el botón."
        ];
      } else {
        steps = [
          "Revisa que la ubicación esté activada en la configuración de tu celular.",
          "Revisa que el navegador tenga permiso de ubicación en sus ajustes.",
          "Vuelve a esta página y toca de nuevo el botón."
        ];
      }

      const stepsHtml = steps.map((s) => `<li>${s}</li>`).join("");

      container.innerHTML = `
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal-box">
            <h2>📍 No pudimos obtener tu ubicación</h2>
            <p>Tu celular no nos dejó acceder a la ubicación. Sigue estos pasos para activarla:</p>
            <ol class="help-steps">${stepsHtml}</ol>
            <div class="modal-row">
              <button class="modal-btn-no" id="modalWhatsappAnyway">${source === "whatsapp" ? "Continuar sin ubicación" : "Cerrar"}</button>
              <button class="modal-btn-yes" id="modalCloseHelp">Entendido</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("modalCloseHelp").addEventListener("click", closeModal);
      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target.id === "modalOverlay") closeModal();
      });
      document.getElementById("modalWhatsappAnyway").addEventListener("click", () => {
        if (source === "whatsapp") {
          const text = encodeURIComponent(
            `Hola, encontré a ${petName} 🐾. Te voy a compartir mi ubicación por aquí para que puedas venir a buscarla. (Toca el clip 📎 y luego "Ubicación" para enviarla)`
          );
          window.location.href = `https://wa.me/${cleanPhone}?text=${text}`;
        } else {
          closeModal();
        }
      });
    }

    function closeModal() {
      document.getElementById("modalContainer").innerHTML = "";
    }

    function openLostModal(plate, pet) {
      const container = document.getElementById("modalContainer");
      const petName = pet.name || "tu mascota";

      if (!plate.is_lost) {
        // Paso 1: preguntar si se perdió
        container.innerHTML = `
          <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
              <h2>¿${petName} se ha perdido?</h2>
              <p>Si confirmas, la placa mostrará una alerta a quien la escanee.</p>
              <div class="modal-row">
                <button class="modal-btn-no" id="modalNo">No</button>
                <button class="modal-btn-yes" id="modalYes">Sí, se perdió</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("modalNo").addEventListener("click", closeModal);
        document.getElementById("modalOverlay").addEventListener("click", (e) => {
          if (e.target.id === "modalOverlay") closeModal();
        });
        document.getElementById("modalYes").addEventListener("click", () => openPinModal(plate, pet, true));
      } else {
        // Ya está perdida: preguntar si la encontraron
        container.innerHTML = `
          <div class="modal-overlay" id="modalOverlay">
            <div class="modal-box">
              <h2>¿Ya encontraste a ${petName}?</h2>
              <p>Si confirmas, se quitará la alerta de la placa.</p>
              <div class="modal-row">
                <button class="modal-btn-no" id="modalNo">Todavía no</button>
                <button class="modal-btn-yes" id="modalYes">Sí, la encontré</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("modalNo").addEventListener("click", closeModal);
        document.getElementById("modalOverlay").addEventListener("click", (e) => {
          if (e.target.id === "modalOverlay") closeModal();
        });
        document.getElementById("modalYes").addEventListener("click", () => openPinModal(plate, pet, false));
      }
    }

    function openPinModal(plate, pet, goingLost) {
      const container = document.getElementById("modalContainer");
      container.innerHTML = `
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal-box">
            <h2>Código de seguridad</h2>
            <p>Ingresa el código de 4 dígitos del tutor para confirmar.</p>
            <input type="tel" inputmode="numeric" maxlength="4" id="pinInput" placeholder="••••">
            <div class="modal-error" id="pinError"></div>
            <div class="modal-row">
              <button class="modal-btn-no" id="modalCancel">Cancelar</button>
              <button class="modal-btn-yes" id="modalConfirm">Confirmar</button>
            </div>
          </div>
        </div>
      `;
      const pinInput = document.getElementById("pinInput");
      pinInput.focus();
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalOverlay").addEventListener("click", (e) => {
        if (e.target.id === "modalOverlay") closeModal();
      });
      document.getElementById("modalConfirm").addEventListener("click", () => {
        const entered = pinInput.value.trim();
        if (!plate.admin_pin || entered !== String(plate.admin_pin).trim()) {
          document.getElementById("pinError").textContent = "Código incorrecto.";
          return;
        }
        applyLostStatus(plate, goingLost);
      });
    }

    async function applyLostStatus(plate, goingLost) {
      try {
        const url = SUPABASE_URL + "/rest/v1/plates?public_token=eq." + encodeURIComponent(plate.public_token);
        const res = await fetch(url, {
          method: "PATCH",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            Prefer: "return=representation"
          },
          body: JSON.stringify({ is_lost: goingLost })
        });

        if (!res.ok) {
          const errBody = await res.text();
          console.error("Error de Supabase:", res.status, errBody);
          document.getElementById("pinError").textContent = "Error (" + res.status + "): " + errBody;
          return;
        }

        location.reload();
      } catch (err) {
        console.error(err);
        document.getElementById("pinError").textContent = "Ocurrió un error de red. Intenta de nuevo.";
      }
    }

    loadPet();
  </script>
</body>
